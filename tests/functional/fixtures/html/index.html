<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AnimXYZ core fixture</title>
<!-- Declared BEFORE the core stylesheet so `base` sorts before `xyz`: styles in
     @layer base deliberately lose to AnimXYZ, unlayered styles beat it. -->
<style>@layer base, xyz;</style>
<link rel="stylesheet" href="./animxyz.css">
<style>
	.box { width: 40px; height: 40px; background: #4d4dff; margin: 4px; }
	.row { display: flex; }

	/* Unlayered author CSS — must beat AnimXYZ (v1 removed every !important) */
	#layer-unlayered { position: static; }
</style>
<style>
	@layer base {
		/* Author CSS that opts into losing by living in a layer before `xyz` */
		#layer-base { position: static; }
	}
</style>
</head>
<body>

<!-- Mode classes attach the core keyframe animations -->
<section id="modes">
	<div id="mode-in" class="box xyz-in xyz-paused" data-xyz="fade"></div>
	<div id="mode-out" class="box xyz-out xyz-paused" data-xyz="fade"></div>
	<div id="mode-appear" class="box xyz-appear xyz-paused" data-xyz="fade"></div>
</section>

<!-- Utilities set --xyz-* custom properties via [data-xyz~=...] selectors -->
<section id="utilities">
	<div id="u-fade" data-xyz="fade"></div>
	<div id="u-fade-level" data-xyz="fade-50%"></div>
	<div id="u-translate" data-xyz="up right-2 back-4"></div>
	<div id="u-translate-level" data-xyz="down-3 left-100% front-2"></div>
	<div id="u-rotate" data-xyz="flip-up-2 flip-left rotate-right-50%"></div>
	<div id="u-scale" data-xyz="big"></div>
	<div id="u-scale-small" data-xyz="small-25%"></div>
	<div id="u-scale-x" data-xyz="wide-3"></div>
	<div id="u-scale-y" data-xyz="tall-100%"></div>
	<div id="u-scale-z" data-xyz="thick-2"></div>
	<div id="u-skew" data-xyz="skew-left-3 skew-down-2"></div>
	<div id="u-timing" data-xyz="duration-10 delay-2 stagger-3 stagger-rev-1 iterate-3 ease-linear direction-alternate origin-top perspective-2"></div>
	<div id="u-mode-scoped" data-xyz="in-fade out-up-100% appear-duration-20"></div>
</section>

<!-- v1 renamed the configuration attribute; the legacy bare `xyz` attribute
     must NOT be matched (there is no dual-selector fallback). -->
<section id="legacy-attribute">
	<div id="legacy-xyz" xyz="fade up"></div>
</section>

<!-- Computed animation shorthand values on an active element -->
<section id="animation">
	<div id="anim-active" class="box xyz-in xyz-paused" data-xyz="fade duration-10 delay-2 ease-linear"></div>
	<div id="anim-iterate" class="box xyz-in xyz-paused" data-xyz="fade iterate-3"></div>
</section>

<!-- Stagger: nested children get increasing animation-delay by nth-child index -->
<section id="stagger">
	<div id="stagger-root" class="row xyz-in xyz-paused-all" data-xyz="fade stagger-2">
		<div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div>
	</div>
	<div id="stagger-rev-root" class="row xyz-in xyz-paused-all" data-xyz="fade stagger-rev-2">
		<div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div>
	</div>
</section>

<!-- Its own section so the root's own sibling index stays 0 and does not shift
     the delays asserted for #stagger-root / #stagger-rev-root above. -->
<section id="stagger-past-cap">
	<!-- 25 children: past the $xyz-index-levels (20) nth-child ladder, so only
	     the sibling-index() enhancement can keep the delays climbing. -->
	<div id="stagger-uncapped" class="row xyz-in xyz-paused-all" data-xyz="fade stagger-2">
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div><div class="box xyz-nested"></div>
		<div class="box xyz-nested"></div>
	</div>
</section>

<!-- Nested elements animate with (and only with) their parent's mode -->
<section id="nesting">
	<div id="nested-root" class="xyz-in xyz-paused-all" data-xyz="fade">
		<div id="nested-child" class="box xyz-nested"></div>
		<div id="nested-in-child" class="box xyz-in-nested"></div>
		<div id="nested-out-child" class="box xyz-out-nested"></div>
		<div id="nested-plain" class="box"></div>
	</div>
</section>

<!-- Variable scoping: [data-xyz] resets, [data-xyz~='inherit'] opts back in -->
<section id="scoping">
	<div id="scope-root" data-xyz="fade">
		<div id="scope-plain"></div>
		<div id="scope-reset" data-xyz="up"></div>
		<div id="scope-inherit" data-xyz="inherit up"></div>
	</div>
</section>

<!-- @property registration: a garbage value on a registered dial is rejected at
     computed-value time and falls back to the typed initial-value. -->
<section id="typed-dials">
	<div id="prop-garbage" style="--xyz-opacity: red; --xyz-scale-x: nonsense; --xyz-rotate-z: 42"></div>
	<div id="prop-unregistered" style="--xyz-in-opacity: red"></div>
</section>

<!-- Behavior toggles -->
<section id="toggles">
	<div id="toggle-paused" class="box xyz-in xyz-paused" data-xyz="fade"></div>
	<div id="toggle-none" class="box xyz-in xyz-none" data-xyz="fade"></div>
	<div id="toggle-absolute" class="box xyz-out xyz-paused xyz-absolute" data-xyz="fade"></div>
</section>

<!-- Cascade layers: who wins now that !important is gone -->
<section id="layers">
	<div id="layer-unlayered" class="box xyz-out xyz-paused xyz-absolute" data-xyz="fade"></div>
	<div id="layer-base" class="box xyz-out xyz-paused xyz-absolute" data-xyz="fade"></div>
</section>

<!-- Dynamically-triggered animations, driven from the spec -->
<section id="dynamic">
	<div id="dyn-box" class="box" data-xyz="fade small duration-1"></div>
	<div id="dyn-nested-root" data-xyz="fade duration-1 stagger-0.5">
		<div id="dyn-nested-1" class="box xyz-nested"></div>
		<div id="dyn-nested-2" class="box xyz-nested"></div>
	</div>
</section>

<script>
	window.animEvents = []
	document.addEventListener('animationend', function (event) {
		window.animEvents.push({ id: event.target.id, name: event.animationName })
	})
	window.trigger = function (id, className) {
		document.getElementById(id).classList.add(className)
	}
</script>

</body>
</html>
