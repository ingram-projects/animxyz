# Publishes packages and creates GitHub Releases via Changesets.
#
# On every push to master this opens (or updates) a "Version Packages" PR that
# applies pending changesets and bumps versions. When that PR is merged, this
# same workflow runs `npm run release` to publish to npm AND — because
# changesets/action defaults createGithubReleases to true — files a GitHub
# Release for each tag it pushes, which is what populates the "Releases" panel
# on the repo page.
#
# Requires an NPM_TOKEN repository secret holding a *granular access token* with
# write access to the @animxyz packages and "Bypass 2FA" enabled (off by
# default, and required for non-interactive CI). Classic/"automation" tokens were
# permanently revoked on 2025-12-09 and cannot be recreated.
#
# Write-enabled granular tokens are capped at 90 days, so this secret has to be
# rotated quarterly. When a release run fails to publish, an expired NPM_TOKEN is
# the first thing to check.
#
# npm's trusted publishing (OIDC) removes the token entirely and is the intended
# replacement — currently optional, with no deadline forcing the switch. It is
# not used here yet because npm/cli#8976 returns E404 when publishing scoped
# packages via OIDC from changesets/action, and every @animxyz package is scoped.
# Switching later means: add `id-token: write` to permissions, upgrade npm to
# >= 11.5.1 (node 22 still ships 10.9.x), drop NODE_AUTH_TOKEN below, and
# register a trusted publisher per package pointing at this workflow filename.
#
# GITHUB_TOKEN is provided automatically and is what lets the action create
# Releases.
name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Changesets needs full history to compare tags and generate notes.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          # Matches the root package.json "release" script:
          #   turbo run build && changeset publish
          publish: npm run release
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
